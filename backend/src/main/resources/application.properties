# Server Configuration
server.port=8081

# H2 Database Configuration (Out-of-the-box, no MySQL server required)
spring.datasource.url=jdbc:h2:mem:crms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Schema Setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# MySQL Configuration (Uncomment to use MySQL database server)
# spring.datasource.url=jdbc:mysql://localhost:3306/crms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=crms_user
# spring.datasource.password=crms_password_2024
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration (Secret must be at least 256 bits / 32 bytes for HS256)
crms.jwt.secret=crms_super_secret_jwt_key_for_crms_management_system_2024_secure
crms.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false